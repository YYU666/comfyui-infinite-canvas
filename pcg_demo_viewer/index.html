<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PCG · 只读 3D 演示</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div><span class="eyebrow">REFMUSE / PCG LAB</span><h1>几何生成 · 实时演示</h1></div><div class="badge">隔离本地实例 · 只读展示</div></header>
<main>
 <section class="stage" aria-label="只读三维结果">
  <div class="stage-top"><span id="connection">正在连接本地实例…</span><button id="rotate" type="button">暂停转台</button></div>
  <div class="viewport"><canvas id="model" aria-label="真实 GLB 三维模型"></canvas><div id="empty">等待真实几何产物</div><div class="view-label">自动取景 / 本地 WebGL / 无建模交互</div></div>
  <div class="model-info"><strong id="model-title">尚未加载</strong><span id="geometry">—</span></div>
  <div id="warning" role="status" hidden></div>
  <dl class="identity"><dt>期望展示</dt><dd id="desired">—</dd><dt>实际已绘制</dt><dd id="displayed">—</dd><dt>实例</dt><dd id="instance">—</dd></dl>
 </section>
 <aside>
  <section class="panel"><div class="panel-head"><h2>真实节点执行</h2><span id="run-status">未运行</span></div><p id="progress">每个节点完成后展示该阶段真实 GLB，字段步骤保留关联模型。</p><div id="graph" aria-label="执行图与所有连线"></div><p class="mono" id="run-id">—</p></section>
  <section class="panel"><h2>受管产物</h2><label for="asset">切换展示（运行中手动选择会暂停跟随）</label><select id="asset"><option value="">等待产物</option></select><p id="asset-detail" class="small"></p></section>
  <section class="panel"><h2>隔离测试</h2><p class="small">只运行本实例的受限几何任务，不连接生图服务。新任务会恢复阶段自动跟随。</p><form id="run-form"><label for="recipe">测试图</label><select id="recipe"><option value="rock">岩石 · 网格与字段</option><option value="scatter">散布 · 点集与共享实例</option></select><label for="seed">Seed</label><input id="seed" type="number" min="0" max="2147483647" value="11"><div class="actions"><button id="run" type="submit">运行真实阶段</button><button id="cancel" type="button" disabled>取消本次</button></div></form></section>
 </aside>
</main><footer>渲染、自动转台和阶段刷新均在本机执行，不请求 AI。</footer>
<script type="module" src="/app.js"></script></body></html>
