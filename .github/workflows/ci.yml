name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python / ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows default encoding
            utf8: "0"
          - name: UTF-8
            utf8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install locked Node dependencies
        run: npm ci
      - name: Run backend and fault-injection tests
        env:
          PYTHONUTF8: ${{ matrix.utf8 }}
          H3_WORKBENCH_TEST_MODE: "1"
        run: npm run test:python

  node-and-browser:
    name: Node, build and isolated Chromium
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install Playwright-managed Chromium
        run: npx playwright-core install chromium
      - name: Build frontend into the CI temporary directory
        run: npm run build -- --outDir "$env:RUNNER_TEMP\h3-dist"
      - name: Run Node tests
        env:
          H3_WORKBENCH_TEST_MODE: "1"
        run: npm run test:node
      - name: Run isolated browser and backend tests
        env:
          H3_WORKBENCH_TEST_MODE: "1"
          H3_TEST_PYTHON: python
          H3_TEST_DIST_DIR: ${{ runner.temp }}\h3-dist
          H3_WORKBENCH_DIST_DIR: ${{ runner.temp }}\h3-dist
        run: npm run test:browser
