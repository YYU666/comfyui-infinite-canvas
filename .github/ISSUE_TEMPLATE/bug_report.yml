name: 缺陷报告
description: 报告可复现的功能、安装、性能或数据安全问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请不要上传密钥、实例令牌、Cookie、私人素材、模型权重或未脱敏日志。安全漏洞请改用 Security Advisories 私密报告。
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      description: 例如 v1.0.0 或完整 commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: Windows、Python、Node.js、ComfyUI 版本；不涉及生成时可省略 ComfyUI
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 使用合成项目写清操作、输入和频率，不要粘贴真实用户素材
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏错误
      description: 保留错误码和关键堆栈，删除令牌、账号和私人路径
    validations:
      required: true
  - type: textarea
    id: isolation
    attributes:
      label: 已排除的环境因素
      description: 是否在临时项目复现、默认编码与 UTF-8 是否一致、真实 ComfyUI 队列是否为空
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 报告不包含密钥、私人素材、模型权重或未脱敏日志
          required: true
        - label: 这不是需要私密处理的安全漏洞
          required: true
